apiVersion: apps/v1
kind: Deployment
metadata:
  name: resilience-api
  namespace: resilience-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resilience-api
  template:
    metadata:
      labels:
        app: resilience-api
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: api
          image: resilience-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
