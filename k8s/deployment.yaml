apiVersion: apps/v1
kind: Deployment
metadata:
  name: resilience-api
  namespace: resilience-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resilience-api
  template:
    metadata:
      labels:
        app: resilience-api
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: api
          image: resilience-api:local
          imagePullPolicy: Never
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: ticketing-secrets, key: db-password }
            - name: DATABASE_URL
              value: postgresql://ticketing:$(DB_PASSWORD)@postgres:5432/ticketing
            - name: WORKER_TOKEN
              valueFrom:
                secretKeyRef: { name: ticketing-secrets, key: worker-token }
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 5
          resources:
            requests: { cpu: 30m, memory: 64Mi }
            limits: { cpu: 250m, memory: 192Mi }
