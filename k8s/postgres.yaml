apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ticketing-data
  namespace: resilience-lab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: resilience-lab
spec:
  selector: { app: ticketing-db }
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketing-db
  namespace: resilience-lab
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: ticketing-db }
  template:
    metadata:
      labels: { app: ticketing-db }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: ticketing
            - name: POSTGRES_DB
              value: ticketing
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: ticketing-secrets, key: db-password }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, ticketing, -d, ticketing]
            periodSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 300m, memory: 384Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ticketing-data
